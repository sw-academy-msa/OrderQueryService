# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Account의 리뷰 형식은 유지하고 주문 Query의 실제 책임으로 제한합니다.
language: ko-KR
tone_instructions: "한국어로 간결하게 설명하고 실제 보안, 데이터 일관성, 계약 위반을 우선하세요."
reviews:
  profile: chill
  high_level_summary: true
  review_status: true
  poem: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    base_branches: ["^main$", "^develop$"]
  path_filters:
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!**/.idea/**"
    - "!gradle/wrapper/*.jar"
  path_instructions:
    - path: "src/main/java/com/msa/orderquery/**"
      instructions: |
        Java 21, Spring Boot MVC, JPA 기반 주문 조회 앱입니다.
        Query는 orders_query만 소유하고 Command DB, Account 테이블을 직접 읽지 않습니다.
        일반 Gateway GET과 독립 JWT 검증, roles, 본인 주문/문의 소유권을 확인하세요.
        ApiResponse, 빌더, 도메인 예외, service 인터페이스와 service/impl, request/response DTO 구분을 유지하세요.
        별도 Mapper 추출이나 주문 Saga, 결제, 재고 변경 구현을 요구하지 마세요.
        eventId 중복, 같은 버전 충돌, 순서 역전, DB 커밋과 offset, DLT 실패 재시도를 검토하세요.
        개인정보, 배송지, 문의, 객체 키, 토큰을 로그나 불필요한 HTTP 필드로 노출하지 않습니다.
        PostgreSQL 잠금 SQL은 JPA Repository의 @Query에만 둡니다.
    - path: "src/main/resources/application*.yaml"
      instructions: |
        개발 update, 테스트 create-drop, 운영 validate는 구분된 정책입니다.
        실제 AWS 키나 로컬 DB 실행을 테스트의 필수 조건으로 요구하지 마세요.
        운영 JWT 공개키는 HTTPS로 조회하고 비밀값은 외부에서 주입합니다.
