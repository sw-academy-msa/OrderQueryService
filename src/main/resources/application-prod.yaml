# 일반 풀/RDS에 배치하며 앱이 운영 스키마를 수정하지 않습니다. 운영 준비 후 validate를 사용합니다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: 2
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    listener:
      auto-startup: true
query:
  events:
    enabled: true
  auth:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    jwk-set-uri: ${ACCOUNT_JWKS_URI}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE}
  instance:
    hostname: ${SERVICE_HOSTNAME}
    instance-id: ${spring.application.name}:${SERVICE_INSTANCE_ID}
    non-secure-port: ${SERVICE_PORT}
